        color: #ffffff;

        display: flex;
        align-items: center;
        gap: 0.25rem;
        flex-wrap: wrap;

      .pv-cat-btn {
        padding: 0.375rem 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        border: none;
        background: transparent;
        color: #64748b;
        cursor: pointer;
        transition: all 0.15s ease;

      .pv-grid {

        // Load Local Prompts
        function loadLocalPrompts() {
          try {
            const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch (_) {}
          return SEED_PROMPTS.slice();
        }

          try {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(list));
          } catch (_) {}
        }

        // State
        const state = {
          user: null,
          cloudPrompts: [],
          localPrompts: loadLocalPrompts(),
          searchQuery: '',
          selectedCategory: 'All',
          geminiReasons: null,
          isSearching: false,
          copiedId: null,
          deletingId: null,
          toast: null,
          bannerError: null,
          modalOpen: false,
          editingPrompt: null,
          formContent: '',
          formTitle: '',
          formCategory: 'Coding',
          formPinned: false,
          formError: '',
          formNotice: '',
          isNaming: false,
          confirmModalDelete: false,
          fbApi: null,
          unsubscribeCloud: null,
        };

        function getActivePrompts() {
          return state.user ? state.cloudPrompts : state.localPrompts;
        }

        function showToast(msg) {
          state.toast = msg;
          render();
          setTimeout(() => {
            if (state.toast === msg) {
              state.toast = null;
              render();
            }
          }, 2200);
        }

        function escapeHtml(str) {
          return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function filterPrompts() {
          const prompts = getActivePrompts();
          const q = state.searchQuery.trim().toLowerCase();

          if (state.geminiReasons && q.length > 0) {
            const matchedIds = Object.keys(state.geminiReasons);
            const scoped = prompts
              .filter(
                (p) =>
                  (state.selectedCategory === 'All' || p.category === state.selectedCategory) &&
                  state.geminiReasons[p.id]
              )
              .sort((a, b) => state.geminiReasons[b.id].score - state.geminiReasons[a.id].score);
            if (scoped.length > 0) return scoped;
          }

          const stopWords = new Set([
            'help',
            'me',
            'the',
            'and',
            'for',
            'with',
            'how',
            'to',
            'in',
            'of',
            'a',
            'an',
            'find',
            'prompt',
            'prompts',
            'that',
            'can',
          ]);

          return prompts
            .filter((p) => {
              if (state.selectedCategory !== 'All' && p.category !== state.selectedCategory) {
                return false;
              }
              if (q.length > 0) {
                const hay = [
                  p.title,
                  p.description,
                  p.content,
                  p.category,
                  ...(p.tags || []),
                ]
                  .join(' ')
                  .toLowerCase();
                if (!hay.includes(q)) {
                  const tokens = q
                    .split(/[^a-z0-9]+/i)
                    .filter((t) => t.length >= 2 && !stopWords.has(t));
                  if (tokens.length === 0 || !tokens.some((tok) => hay.includes(tok))) {
                    return false;
                  }
                }
              }
              return true;
            })
            .sort((a, b) => {
              if (Boolean(a.isPinned) !== Boolean(b.isPinned)) {
                return a.isPinned ? -1 : 1;
              }
              return (b.updatedAtMs || 0) - (a.updatedAtMs || 0);
            });
        }

        // Smart Auto-Name (uses server endpoint when available, or smart client heuristic on static GitHub Pages)
        async function autoNamePrompt() {
          const text = state.formContent.trim();
          if (!text) {
            state.formError = 'Paste or write your prompt text first so it can be named.';
            render();
            return;
          }

          state.isNaming = true;
          state.formError = '';
          state.formNotice = '';
          render();

          try {
            const resp = await fetch('/api/gemini/name-prompt', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: text }),
            });
            if (resp.ok) {
              const data = await resp.json();
              if (data && data.title) {
                state.formTitle = String(data.title).slice(0, 120);
                if (CATEGORIES.includes(data.category)) {
                  state.formCategory = data.category;
                }
                state.formNotice = 'Heading and category generated with Gemini.';
                state.isNaming = false;
                render();
                return;
              }
            }
          } catch (_) {
            // Static host (GitHub Pages) fallback below
          }

          // Smart synthesis fallback for static GitHub Pages hosting
          const lower = text.toLowerCase();
          let guessedCategory = state.formCategory;
          if (/(typescript|python|code|api|sql|react|endpoint|function|bug|test)/.test(lower)) {
            guessedCategory = 'Coding';
          } else if (/(security|firestore|cloud|system|docker|kubernetes|terraform)/.test(lower)) {
            guessedCategory = 'System';
          } else if (/(analyze|explain|bottleneck|profile|metrics|audit|diagnose)/.test(lower)) {
            guessedCategory = 'Analysis';
          } else if (/(research|paper|rfc|compare|synthesis|literature|study)/.test(lower)) {
            guessedCategory = 'Research';
          } else if (/(write|postmortem|changelog|release|blog|copy|email|essay)/.test(lower)) {
            guessedCategory = 'Writing';
          } else if (/(story|creative|brainstorm|design|concept)/.test(lower)) {
            guessedCategory = 'Creative';
          }

          const firstLine = text
            .split(/\n+/)[0]
            .replace(/^(act as a|you are a|write a|design a|create a|analyze the)\s+/i, '')
            .replace(/\{\{[^}]+\}\}/g, '')
            .replace(/[^\w\s&-]/g, '')
            .trim();

          const words = firstLine.split(/\s+/).filter(Boolean).slice(0, 6);
          const synthesizedTitle =
            words.length > 0
              ? words.map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')
              : `${guessedCategory} Prompt Template`;

          state.formTitle = synthesizedTitle.slice(0, 120);
          state.formCategory = guessedCategory;
          state.formNotice = 'Generated clean heading and category from prompt content.';
          state.isNaming = false;
          render();
        }

        // Semantic Search (uses server endpoint when available, or smart semantic scoring on static GitHub Pages)
        async function runSemanticSearch() {
          const q = state.searchQuery.trim();
          const prompts = getActivePrompts();
          if (!q || prompts.length === 0) return;

          state.isSearching = true;
          render();

          try {
            const resp = await fetch('/api/gemini/search-prompts', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: q, prompts }),
            });
            if (resp.ok) {
              const data = await resp.json();
              if (data && Array.isArray(data.matches)) {
                const map = {};
                data.matches.forEach((m) => {
                  if (m && m.id && m.relevanceScore > 0) {
                    map[m.id] = {
                      score: m.relevanceScore,
                      reason: m.matchReason || 'Matched by semantic intent',
                    };
                  }
                });
                state.geminiReasons = map;
                state.isSearching = false;
                render();
                return;
              }
            }
          } catch (_) {}

          // Client-side semantic intent matcher for static GitHub Pages
          const tokens = q
            .toLowerCase()
            .split(/[^a-z0-9]+/i)
            .filter((t) => t.length >= 2);
          const map = {};
          prompts.forEach((p) => {
            const hay = [p.title, p.description, p.content, p.category, ...(p.tags || [])]
              .join(' ')
              .toLowerCase();
            let score = 0;
            const matched = [];
            tokens.forEach((tok) => {
              if (hay.includes(tok)) {
                score += p.title.toLowerCase().includes(tok) ? 35 : 20;
                matched.push(tok);
              }
            });
            if (score > 0) {
              map[p.id] = {
                score: Math.min(100, score),
                reason: `Matches intent keywords: ${matched.slice(0, 4).join(', ')}`,
              };
            }
          });
          state.geminiReasons = map;
          state.isSearching = false;
          render();
        }

        // Copy Square Prompt
        async function copyPromptSquare(promptId) {
          const prompt = getActivePrompts().find((p) => p.id === promptId);
          if (!prompt) return;

          try {
            await navigator.clipboard.writeText(prompt.content);
          } catch (_) {
            const ta = document.createElement('textarea');
            ta.value = prompt.content;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }

          state.copiedId = prompt.id;
          showToast(`Copied "${prompt.title}" to clipboard`);
          setTimeout(() => {
            if (state.copiedId === prompt.id) {
              state.copiedId = null;
              render();
            }
          }, 2000);

          if (state.user && state.fbApi) {
            try {
              await state.fbApi.incrementUsage(prompt.id, prompt.usageCount || 0);
            } catch (_) {}
          } else {
            state.localPrompts = state.localPrompts.map((p) =>
              p.id === prompt.id
                ? { ...p, usageCount: (p.usageCount || 0) + 1, updatedAtMs: Date.now() }
                : p
            );
            saveLocalPrompts(state.localPrompts);
            render();
          }
        }

        // Toggle Pin
        async function togglePin(promptId) {
          const prompt = getActivePrompts().find((p) => p.id === promptId);
          if (!prompt) return;

          if (state.user && state.fbApi) {
            await state.fbApi.togglePin(prompt.id, !prompt.isPinned);
          } else {
            state.localPrompts = state.localPrompts.map((p) =>
              p.id === prompt.id ? { ...p, isPinned: !p.isPinned } : p
            );
            saveLocalPrompts(state.localPrompts);
            render();
          }
        }

        // Delete Prompt
        async function deletePrompt(promptId) {
          const target = getActivePrompts().find((p) => p.id === promptId);
          state.deletingId = null;
          if (state.user && state.fbApi) {
            await state.fbApi.deletePrompt(promptId);
          } else {
            state.localPrompts = state.localPrompts.filter((p) => p.id !== promptId);
            saveLocalPrompts(state.localPrompts);
          }
          if (target) {
            showToast(`Deleted "${target.title}"`);
          } else {
            render();
          }
        }

        // Save Prompt from Modal
        async function saveModalPrompt() {
          const title = state.formTitle.trim();
          const content = state.formContent.trim();
          if (!content) {
            state.formError = 'Prompt text is required.';
            render();
            return;

          if (!title) {

            render();

          }

          const category = CATEGORIES.includes(state.formCategory) ? state.formCategory : 'Coding';

          if (state.user && state.fbApi) {
            if (state.editingPrompt) {
              await state.fbApi.updatePrompt(state.editingPrompt.id, {
                title,

                targetModel: state.editingPrompt.targetModel || 'Gemini 2.5 Pro',
                collectionName: state.editingPrompt.collectionName || 'Core Library',
                tags: state.editingPrompt.tags || [],
              });
            } else {
              await state.fbApi.createPrompt(state.user.uid, {
                title,
                content,
                category,

              });
            }
          } else {
            const now = Date.now();
            if (state.editingPrompt) {
              state.localPrompts = state.localPrompts.map((p) =>
                p.id === state.editingPrompt.id
                  ? { ...p, title, content, category, isPinned, updatedAtMs: now }
                  : p
              );
            } else {
              state.localPrompts = [
                {
                  id: 'local_' + now,
                  title,
                  description: '',
                  content,
                  category,
                  targetModel: 'Gemini 2.5 Pro',
                  collectionName: 'Core Library',
                  tags: [],
                  isPinned,
                  usageCount: 0,
                  ownerId: 'local_workspace',
                  createdAtMs: now,
                  updatedAtMs: now,
                },
                ...state.localPrompts,
              ];
            }
            saveLocalPrompts(state.localPrompts);
          }

          const wasEditing = Boolean(state.editingPrompt);

        // Initialize Firebase via official gstatic ESM CDN
        async function initFirebase() {
          try {
            const [appMod, authMod, fsMod] = await Promise.all([
              import('https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js'),
              import('https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js'),
              import('https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js'),
            ]);

            const app = appMod.initializeApp(FIREBASE_CONFIG);
            const auth = authMod.getAuth(app);
            const db = fsMod.getFirestore(app, FIREBASE_CONFIG.firestoreDatabaseId);
            const provider = new authMod.GoogleAuthProvider();

            state.fbApi = {
              signIn: () => authMod.signInWithPopup(auth, provider),
              signOut: () => authMod.signOut(auth),
              createPrompt: async (uid, data) => {
                const id = 'prm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
                await fsMod.setDoc(fsMod.doc(db, 'prompts', id), {
                  title: data.title.slice(0, 120),
                  description: '',
                  content: data.content.slice(0, 10000),
                  category: data.category,
                  targetModel: 'Gemini 2.5 Pro',
                  collectionName: 'Core Library',
                  tags: [],
                  isPinned: Boolean(data.isPinned),
                  usageCount: 0,
                  ownerId: uid,
                  createdAt: fsMod.serverTimestamp(),
                  updatedAt: fsMod.serverTimestamp(),
                });
              },
              updatePrompt: async (id, data) => {
                await fsMod.updateDoc(fsMod.doc(db, 'prompts', id), {
                  title: data.title.slice(0, 120),
                  description: data.description || '',
                  content: data.content.slice(0, 10000),
                  category: data.category,
                  targetModel: data.targetModel || 'Gemini 2.5 Pro',
                  collectionName: data.collectionName || 'Core Library',
                  tags: Array.isArray(data.tags) ? data.tags : [],
                  isPinned: Boolean(data.isPinned),
                  updatedAt: fsMod.serverTimestamp(),
                });
              },
              togglePin: async (id, isPinned) => {
                await fsMod.updateDoc(fsMod.doc(db, 'prompts', id), {
                  isPinned: Boolean(isPinned),
                  updatedAt: fsMod.serverTimestamp(),
                });
              },
              incrementUsage: async (id, current) => {
                await fsMod.updateDoc(fsMod.doc(db, 'prompts', id), {
                  usageCount: current + 1,
                  updatedAt: fsMod.serverTimestamp(),
                });
              },
              deletePrompt: async (id) => {
                await fsMod.deleteDoc(fsMod.doc(db, 'prompts', id));
              },
            };

            authMod.onAuthStateChanged(auth, (user) => {
              state.user = user || null;
              if (state.unsubscribeCloud) {
                state.unsubscribeCloud();
                state.unsubscribeCloud = null;
              }
              if (user) {
                const q = fsMod.query(
                  fsMod.collection(db, 'prompts'),
                  fsMod.where('ownerId', '==', user.uid)
                );
                state.unsubscribeCloud = fsMod.onSnapshot(q, (snap) => {
                  state.cloudPrompts = snap.docs.map((d) => {
                    const data = d.data();
                    return {
                      id: d.id,
                      title: String(data.title || ''),
                      description: String(data.description || ''),
                      content: String(data.content || ''),
                      category: data.category || 'Coding',
                      targetModel: String(data.targetModel || 'Gemini 2.5 Pro'),
                      collectionName: String(data.collectionName || 'Core Library'),
                      tags: Array.isArray(data.tags) ? data.tags : [],
                      isPinned: Boolean(data.isPinned),
                      usageCount: typeof data.usageCount === 'number' ? data.usageCount : 0,
                      ownerId: String(data.ownerId || user.uid),
                      createdAtMs: data.createdAt?.seconds ? data.createdAt.seconds * 1000 : Date.now(),
                      updatedAtMs: data.updatedAt?.seconds ? data.updatedAt.seconds * 1000 : Date.now(),
                    };
                  });
                  render();
                });
              } else {
                state.cloudPrompts = [];
              }
              render();
            });
          } catch (_) {
            // Works offline/locally with LocalStorage if CDN is unreachable
          }
        }

                  </div>

                  ${
                    state.geminiReasons
                      ? `
                        <div class="pv-banner pv-banner-info">
                          <span>✨ Ranked by <strong>Gemini Semantic Search</strong> (${
                            Object.keys(state.geminiReasons).length
                          } matches)</span>
                          <button type="button" id="pv-reset-gemini" style="background:none;border:none;color:#1d4ed8;font-weight:600;cursor:pointer;text-decoration:underline;">Reset</button>
                        </div>
                      `
                      : ''
                  }

                  ${
                    state.bannerError
                      ? `
                        <div class="pv-banner pv-banner-warn">
                          <span>${escapeHtml(state.bannerError)}</span>
                          <button type="button" id="pv-dismiss-err" style="background:none;border:none;color:#78350f;font-weight:600;cursor:pointer;">Dismiss</button>
                        </div>
                      `
                      : ''
                  }
                </section>

                <div class="pv-grid">
                  ${filtered
                    .map((p) => {
                      const isCopied = state.copiedId === p.id;
                      const isConfirmDel = state.deletingId === p.id;
                      const dotColor = isCopied
                        ? '#34d399'
                        : CATEGORY_COLORS[p.category] || '#2563eb';
                      const reasonObj = state.geminiReasons && state.geminiReasons[p.id];

                      return `
                        <div
                          class="pv-square ${isCopied ? 'copied' : ''}"
                          data-copy-id="${escapeHtml(p.id)}"
                          role="button"
                          tabindex="0"
                          aria-label="Copy prompt: ${escapeHtml(p.title)}"
                        >
                          <div class="pv-square-top">
                            <div class="pv-square-meta">
                              <span class="pv-dot" style="background:${dotColor}"></span>
                              <span class="pv-cat-label">${escapeHtml(p.category)}</span>
                              ${
                                p.isPinned
                                  ? `<span class="pv-pinned-label">· Pinned</span>`
                                  : ''
                              }
                            </div>

                            <div class="pv-square-actions" data-stop-prop="1">
                              ${
                                isConfirmDel
                                  ? `
                                    <div class="pv-confirm-pill">
                                      <button type="button" class="pv-confirm-del-btn" data-confirm-del="${escapeHtml(
                                        p.id
                                      )}">Delete</button>
                                      <button type="button" class="pv-confirm-cancel-btn" data-cancel-del="1">✕</button>
                                    </div>
                                  `
                                  : `
                                    <button
                                      type="button"
                                      class="pv-icon-btn ${p.isPinned ? 'pinned' : ''}"
                                      data-pin-id="${escapeHtml(p.id)}"
                                      title="${p.isPinned ? 'Unpin square' : 'Pin square'}"
                                      aria-label="${p.isPinned ? 'Unpin' : 'Pin'} ${escapeHtml(
                                      p.title
                                    )}"
                                    >
                                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
                                    </button>
                                    <button
                                      type="button"
                                      class="pv-icon-btn"
                                      data-edit-id="${escapeHtml(p.id)}"
                                      title="Edit prompt"
                                      aria-label="Edit ${escapeHtml(p.title)}"
                                    >
                                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                                    </button>
                                    <button
                                      type="button"
                                      class="pv-icon-btn delete"
                                      data-ask-del="${escapeHtml(p.id)}"
                                      title="Delete prompt"
                                      aria-label="Delete ${escapeHtml(p.title)}"
                                    >
                                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                    </button>
                                  `
                              }
                            </div>
                          </div>

                          <div class="pv-square-center">
                            <h2 class="pv-square-heading">${escapeHtml(p.title)}</h2>
                            ${
                              reasonObj
                                ? `<p class="pv-square-reason">✨ ${escapeHtml(reasonObj.reason)}</p>`
                                : `<p class="pv-square-preview">${escapeHtml(p.content)}</p>`
                            }
                          </div>

                          <div class="pv-square-bottom">
                            <span class="pv-copy-status">
                              ${
                                isCopied
                                  ? `✓ Copied prompt!`
                                  : `⧉ Click to copy`
                              }
                            </span>
                            <span class="pv-copy-count">${p.usageCount || 0} ${
                        (p.usageCount || 0) === 1 ? 'copy' : 'copies'
                      }</span>
                          </div>
                        </div>
                      `;
                    })
                    .join('')}

                  <button type="button" id="pv-new-tile" class="pv-square-new">
                    <div class="pv-new-circle">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    </div>
                    <div style="text-align:center;">
                      <strong style="display:block;font-family:var(--font-display);font-size:0.875rem;color:#334155;">New Prompt Square</strong>
                      <span style="display:block;font-size:0.75rem;color:#94a3b8;margin-top:0.2rem;">Auto-name with Gemini</span>
                    </div>
                  </button>
                </div>
              </main>

              ${
                state.toast
                  ? `
                    <div class="pv-toast" role="status" aria-live="polite">
                      <span style="color:#34d399;">✓</span>
                      <span>${escapeHtml(state.toast)}</span>
                    </div>
                  `
                  : ''
              }

              ${
                state.modalOpen
                  ? `
                    <div class="pv-modal-backdrop" id="pv-modal-backdrop" role="dialog" aria-modal="true">
                      <div class="pv-modal" id="pv-modal-card">
                        <div class="pv-modal-header">
                          <div>
                            <h2 class="pv-modal-title">${
                              state.editingPrompt ? 'Edit Prompt Square' : 'New Prompt Square'
                            }</h2>
                            <p class="pv-modal-sub">${
                              state.editingPrompt
                                ? 'Update your prompt heading, category, or full prompt text.'
                                : 'Paste your prompt and let Gemini generate a clean heading.'
                            }</p>
                          </div>
                          <button type="button" id="pv-modal-close" class="pv-icon-btn" aria-label="Close">✕</button>
                        </div>

                        <form id="pv-modal-form" class="pv-modal-body">
                          ${
                            state.formError
                              ? `<div class="pv-banner pv-banner-warn" style="margin-top:0;">${escapeHtml(
                                  state.formError
                                )}</div>`
                              : ''
                          }
                          ${
                            state.formNotice
                              ? `<div class="pv-banner pv-banner-info" style="margin-top:0;">✓ ${escapeHtml(
                                  state.formNotice
                                )}</div>`
                              : ''
                          }

                          <div>
                            <div class="pv-field-label-row">
                              <label class="pv-label" for="pv-form-content">Prompt Text *</label>
                            </div>
                            <textarea
                              id="pv-form-content"
                              class="pv-textarea"
                              rows="7"
                              placeholder="Paste or type the full prompt that will be copied when you click this square..."
                            >${escapeHtml(state.formContent)}</textarea>
                          </div>

                          <div class="pv-modal-row">
                            <div>
                              <div class="pv-field-label-row">
                                <label class="pv-label" for="pv-form-title">Square Heading *</label>
                                <button type="button" id="pv-autoname-btn" class="pv-autoname-btn">
                                  ✨ ${state.isNaming ? 'Naming...' : 'Auto-Name with Gemini'}
                                </button>
                              </div>
                              <input
                                id="pv-form-title"
                                type="text"
                                class="pv-input"
                                placeholder="e.g. TypeScript API Endpoint Architect"
                                value="${escapeHtml(state.formTitle)}"
                              />
                            </div>

                            <div>
                              <div class="pv-field-label-row">
                                <label class="pv-label" for="pv-form-category">Category</label>
                              </div>
                              <select id="pv-form-category" class="pv-select">
                                ${CATEGORIES.map(
                                  (cat) => `
                                    <option value="${cat}" ${
                                    state.formCategory === cat ? 'selected' : ''
                                  }>${cat}</option>
                                  `
                                ).join('')}
                              </select>
                            </div>
                          </div>

                          <div>
                            <label style="display:inline-flex;align-items:center;gap:0.5rem;font-size:0.75rem;color:#475569;cursor:pointer;">
                              <input type="checkbox" id="pv-form-pinned" ${
                                state.formPinned ? 'checked' : ''
                              } />
                              <span>Pin this square to the top of the grid</span>
                            </label>
                          </div>

                          <div class="pv-modal-footer">
                            <div>
                              ${
                                state.editingPrompt
                                  ? `
                                    <button
                                      type="button"
                                      id="pv-modal-delete"
                                      class="pv-btn"
                                      style="background:${
                                        state.confirmModalDelete ? '#dc2626' : '#fef2f2'
                                      };color:${
                                      state.confirmModalDelete ? '#ffffff' : '#dc2626'
                                    };"
                                    >
                                      ${
                                        state.confirmModalDelete
                                          ? 'Confirm Delete'
                                          : 'Delete Prompt'
                                      }
                                    </button>
                                  `
                                  : ''
                              }
                            </div>
                            <div style="display:flex;align-items:center;gap:0.5rem;">
                              <button type="button" id="pv-modal-cancel" class="pv-btn pv-btn-outline">Cancel</button>
                              <button type="submit" class="pv-btn pv-btn-primary">
                                ${state.editingPrompt ? 'Save Changes' : 'Create Square'}
                              </button>
                            </div>
                          </div>
                        </form>
                      </div>
                    </div>
                  `
                  : ''
              }
            </div>
          `;

          attachEvents();
        }

        function openCreateModal() {
          state.editingPrompt = null;
          state.formContent = '';
          state.formTitle = '';
          state.formCategory = 'Coding';
          state.formPinned = false;
          state.formError = '';
          state.formNotice = '';
          state.confirmModalDelete = false;
          state.modalOpen = true;
          render();
        }

        function openEditModal(promptId) {
          const prompt = getActivePrompts().find((p) => p.id === promptId);
          if (!prompt) return;
          state.editingPrompt = prompt;
          state.formContent = prompt.content;
          state.formTitle = prompt.title;
          state.formCategory = prompt.category || 'Coding';
          state.formPinned = Boolean(prompt.isPinned);
          state.formError = '';
          state.formNotice = '';
          state.confirmModalDelete = false;
          state.modalOpen = true;
          render();
        }

        function attachEvents() {
          const signinBtn = document.getElementById('pv-signin-btn');
          if (signinBtn) {
            signinBtn.onclick = async () => {
              if (!state.fbApi) {
                state.bannerError = 'Firebase Auth is initializing. Local workspace is active.';
                render();
                return;
              }
              try {
                await state.fbApi.signIn();
              } catch (_) {
                state.bannerError =
                  'Sign-in popup was closed or domain is not authorized yet in Firebase Console. Local prompts remain available.';
                render();
              }
            };
          }

          const signoutBtn = document.getElementById('pv-signout-btn');
          if (signoutBtn) {
            signoutBtn.onclick = () => state.fbApi && state.fbApi.signOut();
          }

          const newBtn = document.getElementById('pv-new-btn');
          if (newBtn) newBtn.onclick = openCreateModal;

          const newTile = document.getElementById('pv-new-tile');
          if (newTile) newTile.onclick = openCreateModal;

          const searchInput = document.getElementById('pv-search-input');
          if (searchInput) {
            searchInput.oninput = (e) => {
              state.searchQuery = e.target.value;
              if (!state.searchQuery.trim()) state.geminiReasons = null;
              const cursorPos = e.target.selectionStart;
              render();
              const nextInput = document.getElementById('pv-search-input');
              if (nextInput) {
                nextInput.focus();
                nextInput.setSelectionRange(cursorPos, cursorPos);
              }
            };
          }

          const clearBtn = document.getElementById('pv-clear-search');
          if (clearBtn) {
            clearBtn.onclick = () => {
              state.searchQuery = '';
              state.geminiReasons = null;
              render();
            };
          }

          const searchForm = document.getElementById('pv-search-form');
          if (searchForm) {
            searchForm.onsubmit = (e) => {
              e.preventDefault();
              runSemanticSearch();
            };
          }

          const resetGemini = document.getElementById('pv-reset-gemini');
          if (resetGemini) {
            resetGemini.onclick = () => {
              state.geminiReasons = null;
              render();
            };
          }

          const dismissErr = document.getElementById('pv-dismiss-err');
          if (dismissErr) {
            dismissErr.onclick = () => {
              state.bannerError = null;
              render();
            };
          }

          document.querySelectorAll('[data-cat]').forEach((btn) => {
            btn.onclick = () => {
              state.selectedCategory = btn.getAttribute('data-cat');
              render();
            };
          });

          document.querySelectorAll('[data-copy-id]').forEach((sq) => {
            sq.onclick = (e) => {
              if (e.target.closest('[data-stop-prop]')) return;
              copyPromptSquare(sq.getAttribute('data-copy-id'));
            };
          });

          document.querySelectorAll('[data-pin-id]').forEach((btn) => {
            btn.onclick = (e) => {
              e.stopPropagation();
              togglePin(btn.getAttribute('data-pin-id'));
            };
          });

          document.querySelectorAll('[data-edit-id]').forEach((btn) => {
            btn.onclick = (e) => {
              e.stopPropagation();
              openEditModal(btn.getAttribute('data-edit-id'));
            };
          });

          document.querySelectorAll('[data-ask-del]').forEach((btn) => {
            btn.onclick = (e) => {
              e.stopPropagation();
              state.deletingId = btn.getAttribute('data-ask-del');
              render();
            };
          });

          document.querySelectorAll('[data-confirm-del]').forEach((btn) => {
            btn.onclick = (e) => {
              e.stopPropagation();
              deletePrompt(btn.getAttribute('data-confirm-del'));
            };
          });

          document.querySelectorAll('[data-cancel-del]').forEach((btn) => {
            btn.onclick = (e) => {
              e.stopPropagation();
              state.deletingId = null;
              render();
            };
          });

          if (state.modalOpen) {
            const syncFormFields = () => {
              const c = document.getElementById('pv-form-content');
              const t = document.getElementById('pv-form-title');
              const cat = document.getElementById('pv-form-category');
              const pin = document.getElementById('pv-form-pinned');
              if (c) state.formContent = c.value;
              if (t) state.formTitle = t.value;
              if (cat) state.formCategory = cat.value;
              if (pin) state.formPinned = pin.checked;
            };

            ['pv-form-content', 'pv-form-title', 'pv-form-category', 'pv-form-pinned'].forEach(
              (id) => {
                const el = document.getElementById(id);
                if (el) el.oninput = syncFormFields;
                if (el) el.onchange = syncFormFields;
              }
            );

            const closeBtn = document.getElementById('pv-modal-close');
            const cancelBtn = document.getElementById('pv-modal-cancel');
            const backdrop = document.getElementById('pv-modal-backdrop');
            const card = document.getElementById('pv-modal-card');

            if (closeBtn) closeBtn.onclick = () => ((state.modalOpen = false), render());
            if (cancelBtn) cancelBtn.onclick = () => ((state.modalOpen = false), render());
            if (backdrop) backdrop.onclick = () => ((state.modalOpen = false), render());
            if (card) card.onclick = (e) => e.stopPropagation();

            const autoBtn = document.getElementById('pv-autoname-btn');
            if (autoBtn) {
              autoBtn.onclick = () => {
                syncFormFields();
                autoNamePrompt();
              };
            }

            const modalDel = document.getElementById('pv-modal-delete');
            if (modalDel) {
              modalDel.onclick = async () => {
                if (!state.confirmModalDelete) {
                  state.confirmModalDelete = true;
                  render();
                  return;
                }
                const id = state.editingPrompt.id;
                state.modalOpen = false;
                state.editingPrompt = null;
                await deletePrompt(id);
              };
            }

            const modalForm = document.getElementById('pv-modal-form');
            if (modalForm) {
              modalForm.onsubmit = (e) => {
                e.preventDefault();
                syncFormFields();
                saveModalPrompt();
              };
            }
          }
        }

        render();
        initFirebase();
      })();
    </script>
  </body>
</html>
